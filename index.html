<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitness Everything</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #141820;
      --panel-2: #1b202a;
      --line: #2a303c;
      --text: #f5f7fb;
      --muted: #9aa4b2;
      --soft: #cbd3df;
      --accent: #7dd3fc;
      --accent-2: #a7f3d0;
      --warn: #fbbf24;
      --danger: #fb7185;
      --ok: #34d399;
      --shadow: 0 14px 50px rgba(0, 0, 0, 0.32);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: var(--text);
    }

    .app {
      width: min(100%, 760px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 14px 90px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      padding: 4px 2px 14px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 1.45rem;
      letter-spacing: 0;
    }

    h2 {
      font-size: 1rem;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 0.92rem;
    }

    .date-pill {
      flex: 0 0 auto;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #10141b;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      padding: 8px 0 12px;
      background: rgba(11, 13, 16, 0.94);
      backdrop-filter: blur(14px);
    }

    .tab {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-weight: 700;
    }

    .tab.active {
      border-color: rgba(125, 211, 252, 0.6);
      background: #122131;
      color: var(--text);
    }

    .view { display: none; }
    .view.active { display: block; }

    .section {
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }

    .section:first-of-type { border-top: 0; }

    .grid {
      display: grid;
      gap: 10px;
    }

    .stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .stat,
    .exercise,
    .body-row,
    .empty {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .stat {
      min-height: 86px;
      padding: 13px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      margin-bottom: 8px;
    }

    .stat strong {
      display: block;
      font-size: 1.35rem;
    }

    .stat small {
      display: block;
      color: var(--muted);
      margin-top: 5px;
      line-height: 1.35;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      align-items: end;
    }

    .control-row.three {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      background: #10141b;
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.16);
    }

    .btn {
      min-height: 44px;
      border-radius: 8px;
      padding: 0 12px;
      background: var(--accent);
      color: #071015;
      font-weight: 900;
    }

    .btn.secondary {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--soft);
    }

    .btn.danger {
      background: transparent;
      border: 1px solid rgba(251, 113, 133, 0.5);
      color: #fecdd3;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .quick {
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--soft);
      font-weight: 800;
    }

    .quick.active {
      border-color: rgba(167, 243, 208, 0.7);
      background: #10251f;
      color: var(--accent-2);
    }

    .exercise {
      overflow: hidden;
    }

    .exercise-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 13px;
      background: #11161f;
      border-bottom: 1px solid var(--line);
    }

    .meta {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
      margin-top: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.13);
      color: #fde68a;
      font-size: 0.72rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .sets {
      display: grid;
      gap: 8px;
      padding: 12px 13px;
    }

    .set-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 38px;
      color: var(--soft);
      font-size: 0.9rem;
    }

    .set-num {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--muted);
      font-weight: 900;
      font-size: 0.78rem;
    }

    .set-pr {
      color: var(--warn);
      font-weight: 900;
      font-size: 0.75rem;
    }

    .chart-wrap {
      height: 220px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .range-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .range {
      min-height: 38px;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 800;
    }

    .range.active {
      color: var(--text);
      border-color: rgba(125, 211, 252, 0.6);
      background: #122131;
    }

    .body-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px;
      align-items: center;
    }

    .body-row strong {
      display: block;
      margin-bottom: 3px;
    }

    .empty {
      padding: 18px 14px;
      color: var(--muted);
      line-height: 1.45;
      box-shadow: none;
    }

    .footer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    @media (min-width: 680px) {
      .app { padding-inline: 22px; }
      .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .dashboard-grid .section {
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Fitness Everything</h1>
        <p class="meta" id="subtitle">Fast workout and body tracking</p>
      </div>
      <div class="date-pill" id="todayLabel"></div>
    </header>

    <nav class="tabs" aria-label="Primary">
      <button class="tab active" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="workout">Workout</button>
      <button class="tab" data-view="body">Body</button>
    </nav>

    <section class="view active" id="dashboard">
      <div class="section">
        <div class="grid stats">
          <div class="stat">
            <span>Today</span>
            <strong id="dashWorkout">0 sets</strong>
            <small id="dashWorkoutMeta">No workout logged yet</small>
          </div>
          <div class="stat">
            <span>Latest Weight</span>
            <strong id="dashWeight">-- kg</strong>
            <small id="dashWeightMeta">No weigh-in yet</small>
          </div>
          <div class="stat">
            <span>This Week</span>
            <strong id="dashWeek">0 days</strong>
            <small>Workout days since Monday</small>
          </div>
          <div class="stat">
            <span>This Month</span>
            <strong id="dashMonth">0 days</strong>
            <small>Workout days this month</small>
          </div>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="section">
          <h2>Weight Trend</h2>
          <div class="range-row">
            <button class="range active" data-range="30">30D</button>
            <button class="range" data-range="60">60D</button>
            <button class="range" data-range="90">90D</button>
          </div>
          <div class="chart-wrap">
            <canvas id="weightChart" width="680" height="360" aria-label="Weight trend chart"></canvas>
          </div>
        </div>

        <div class="section">
          <h2>Recent PRs</h2>
          <div class="grid" id="prList"></div>
        </div>
      </div>
    </section>

    <section class="view" id="workout">
      <div class="section">
        <div class="quick-grid" id="splitButtons">
          <button class="quick active" data-split="Push">Push</button>
          <button class="quick" data-split="Pull">Pull</button>
          <button class="quick" data-split="Legs">Legs</button>
        </div>
      </div>

      <div class="section">
        <h2>Add Exercise</h2>
        <div class="grid">
          <div class="field">
            <label for="exerciseName">Exercise</label>
            <input id="exerciseName" list="exerciseSuggestions" placeholder="Bench press">
            <datalist id="exerciseSuggestions"></datalist>
          </div>
          <div class="control-row three">
            <div class="field">
              <label for="sets">Sets</label>
              <input id="sets" type="number" inputmode="numeric" min="1" value="3">
            </div>
            <div class="field">
              <label for="reps">Reps</label>
              <input id="reps" type="number" inputmode="numeric" min="1" value="8">
            </div>
            <div class="field">
              <label for="weight">Kg</label>
              <input id="weight" type="number" inputmode="decimal" min="0" step="0.5" placeholder="60">
            </div>
          </div>
          <button class="btn" id="addExercise">Add Exercise</button>
        </div>
      </div>

      <div class="section">
        <h2>Today's Workout</h2>
        <div class="grid" id="exerciseList"></div>
      </div>
    </section>

    <section class="view" id="body">
      <div class="section">
        <h2>Log Body</h2>
        <div class="grid">
          <div class="control-row">
            <div class="field">
              <label for="bodyWeight">Weight kg</label>
              <input id="bodyWeight" type="number" inputmode="decimal" min="0" step="0.1" placeholder="75.2">
            </div>
            <div class="field">
              <label for="bodyFat">Body fat %</label>
              <input id="bodyFat" type="number" inputmode="decimal" min="0" max="80" step="0.1" placeholder="18">
            </div>
          </div>
          <button class="btn" id="saveBody">Save Today's Log</button>
        </div>
      </div>

      <div class="section">
        <h2>History</h2>
        <div class="grid" id="bodyHistory"></div>
      </div>

      <div class="section">
        <div class="footer-actions">
          <button class="btn secondary" id="exportData">Export Data</button>
          <button class="btn danger" id="clearData">Clear All</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "fitnessEverythingData.v1";
    const dateKey = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    };
    const todayKey = () => dateKey(new Date());
    const fmtDate = (date) => new Date(date + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const splitDefaults = {
      Push: ["Bench Press", "Incline Dumbbell Press", "Shoulder Press", "Lateral Raise", "Triceps Pushdown"],
      Pull: ["Deadlift", "Pull Up", "Lat Pulldown", "Barbell Row", "Bicep Curl"],
      Legs: ["Squat", "Leg Press", "Romanian Deadlift", "Leg Curl", "Calf Raise"]
    };

    let state = loadState();
    let selectedSplit = state.lastSplit || "Push";
    let chartRange = 30;

    const el = (id) => document.getElementById(id);
    const qsa = (selector) => [...document.querySelectorAll(selector)];

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return saved || { workouts: {}, body: [], prs: [], lastSplit: "Push" };
      } catch {
        return { workouts: {}, body: [], prs: [], lastSplit: "Push" };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function todaysWorkout() {
      const day = todayKey();
      if (!state.workouts[day]) {
        state.workouts[day] = { split: selectedSplit, exercises: [] };
      }
      return state.workouts[day];
    }

    function bestBefore(exerciseName, beforeDate = todayKey()) {
      let best = null;
      Object.entries(state.workouts).forEach(([date, workout]) => {
        if (date >= beforeDate) return;
        workout.exercises.forEach((exercise) => {
          if (exercise.name.toLowerCase() !== exerciseName.toLowerCase()) return;
          exercise.sets.forEach((set) => {
            if (!best || set.weight > best.weight || (set.weight === best.weight && set.reps > best.reps)) {
              best = { ...set, date };
            }
          });
        });
      });
      return best;
    }

    function allExerciseNames() {
      const names = new Set(Object.values(splitDefaults).flat());
      Object.values(state.workouts).forEach((workout) => {
        workout.exercises.forEach((exercise) => names.add(exercise.name));
      });
      return [...names].sort((a, b) => a.localeCompare(b));
    }

    function setActiveView(view) {
      qsa(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.view === view));
      qsa(".view").forEach((section) => section.classList.toggle("active", section.id === view));
      if (view === "dashboard") drawWeightChart();
    }

    function setSplit(split) {
      selectedSplit = split;
      state.lastSplit = split;
      todaysWorkout().split = split;
      saveState();
      render();
    }

    function addExercise() {
      const name = el("exerciseName").value.trim();
      const setCount = Number(el("sets").value);
      const reps = Number(el("reps").value);
      const weight = Number(el("weight").value);
      if (!name || !setCount || !reps || Number.isNaN(weight)) return;

      const previous = bestBefore(name);
      const isPr = Boolean(previous) && (weight > previous.weight || (weight === previous.weight && reps > previous.reps));
      const newSets = Array.from({ length: setCount }, (_, index) => ({
        reps,
        weight,
        pr: isPr,
        loggedAt: new Date().toISOString(),
        id: makeId(index)
      }));

      const workout = todaysWorkout();
      workout.split = selectedSplit;
      workout.exercises.push({
        id: makeId(),
        name,
        sets: newSets
      });

      if (isPr) {
        state.prs.unshift({ name, reps, weight, date: todayKey(), split: selectedSplit });
        state.prs = state.prs.slice(0, 25);
      }

      el("exerciseName").value = "";
      el("weight").value = "";
      saveState();
      render();
      el("exerciseName").focus();
    }

    function deleteExercise(id) {
      const workout = todaysWorkout();
      workout.exercises = workout.exercises.filter((exercise) => exercise.id !== id);
      saveState();
      render();
    }

    function saveBody() {
      const weight = Number(el("bodyWeight").value);
      const bodyFatValue = el("bodyFat").value;
      const bodyFat = bodyFatValue === "" ? null : Number(bodyFatValue);
      if (!weight || Number.isNaN(weight)) return;

      const existing = state.body.find((entry) => entry.date === todayKey());
      const entry = { date: todayKey(), weight, bodyFat: Number.isNaN(bodyFat) ? null : bodyFat };
      if (existing) Object.assign(existing, entry);
      else state.body.push(entry);
      state.body.sort((a, b) => a.date.localeCompare(b.date));

      el("bodyWeight").value = "";
      el("bodyFat").value = "";
      saveState();
      render();
    }

    function workoutDaysWithin(startDate, endDate) {
      return Object.entries(state.workouts)
        .filter(([date, workout]) => date >= startDate && date <= endDate && workout.exercises.length)
        .length;
    }

    function weekStartKey() {
      const now = new Date();
      const day = (now.getDay() + 6) % 7;
      now.setDate(now.getDate() - day);
      return dateKey(now);
    }

    function monthStartKey() {
      const now = new Date();
      return dateKey(new Date(now.getFullYear(), now.getMonth(), 1));
    }

    function renderDashboard() {
      const workout = todaysWorkout();
      const sets = workout.exercises.reduce((sum, exercise) => sum + exercise.sets.length, 0);
      const prs = workout.exercises.reduce((sum, exercise) => sum + exercise.sets.filter((set) => set.pr).length, 0);
      const latestBody = state.body.at(-1);

      el("dashWorkout").textContent = `${sets} set${sets === 1 ? "" : "s"}`;
      el("dashWorkoutMeta").textContent = sets ? `${workout.split} day - ${workout.exercises.length} exercise${workout.exercises.length === 1 ? "" : "s"} - ${prs} PR set${prs === 1 ? "" : "s"}` : "No workout logged yet";
      el("dashWeight").textContent = latestBody ? `${latestBody.weight.toFixed(1)} kg` : "-- kg";
      el("dashWeightMeta").textContent = latestBody ? `${fmtDate(latestBody.date)}${latestBody.bodyFat ? ` - ${latestBody.bodyFat}% body fat` : ""}` : "No weigh-in yet";
      el("dashWeek").textContent = `${workoutDaysWithin(weekStartKey(), todayKey())} days`;
      el("dashMonth").textContent = `${workoutDaysWithin(monthStartKey(), todayKey())} days`;

      const prList = el("prList");
      prList.innerHTML = "";
      if (!state.prs.length) {
        prList.innerHTML = '<div class="empty">PRs will show here when you beat a previous weight or rep mark.</div>';
        return;
      }
      state.prs.slice(0, 5).forEach((pr) => {
        const row = document.createElement("div");
        row.className = "body-row";
        row.innerHTML = `<div><strong>${escapeHtml(pr.name)}</strong><div class="meta">${fmtDate(pr.date)} - ${pr.split}</div></div><span class="badge">${pr.weight} kg x ${pr.reps}</span>`;
        prList.appendChild(row);
      });
    }

    function renderWorkout() {
      qsa("#splitButtons .quick").forEach((button) => button.classList.toggle("active", button.dataset.split === selectedSplit));
      const suggestions = el("exerciseSuggestions");
      suggestions.innerHTML = allExerciseNames().map((name) => `<option value="${name}"></option>`).join("");

      const list = el("exerciseList");
      const workout = todaysWorkout();
      list.innerHTML = "";
      if (!workout.exercises.length) {
        list.innerHTML = '<div class="empty">Pick Push, Pull, or Legs, then add your first exercise. Same weight and reps are copied across sets for speed.</div>';
        return;
      }

      workout.exercises.forEach((exercise) => {
        const previous = bestBefore(exercise.name);
        const card = document.createElement("article");
        card.className = "exercise";
        const prCount = exercise.sets.filter((set) => set.pr).length;
        card.innerHTML = `
          <div class="exercise-head">
            <div>
              <h3>${escapeHtml(exercise.name)}</h3>
              <p class="meta">${previous ? `Previous best: ${previous.weight} kg x ${previous.reps} on ${fmtDate(previous.date)}` : "No previous session yet"}</p>
            </div>
            ${prCount ? '<span class="badge">PR</span>' : ''}
          </div>
          <div class="sets">
            ${exercise.sets.map((set, index) => `
              <div class="set-row">
                <span class="set-num">${index + 1}</span>
                <span>${set.weight} kg x ${set.reps}</span>
                <span class="set-pr">${set.pr ? "NEW PR" : ""}</span>
              </div>
            `).join("")}
            <button class="btn secondary" data-repeat="${exercise.id}">Repeat Set</button>
            <button class="btn danger" data-delete="${exercise.id}">Delete Exercise</button>
          </div>
        `;
        list.appendChild(card);
      });

      qsa("[data-delete]").forEach((button) => button.addEventListener("click", () => deleteExercise(button.dataset.delete)));
      qsa("[data-repeat]").forEach((button) => button.addEventListener("click", () => repeatSet(button.dataset.repeat)));
    }

    function repeatSet(exerciseId) {
      const workout = todaysWorkout();
      const exercise = workout.exercises.find((item) => item.id === exerciseId);
      if (!exercise || !exercise.sets.length) return;
      const last = exercise.sets.at(-1);
      const previous = bestBefore(exercise.name);
      const isPr = Boolean(previous) && (last.weight > previous.weight || (last.weight === previous.weight && last.reps > previous.reps));
      exercise.sets.push({
        reps: last.reps,
        weight: last.weight,
        pr: isPr,
        loggedAt: new Date().toISOString(),
        id: makeId()
      });
      saveState();
      render();
    }

    function renderBody() {
      const history = el("bodyHistory");
      history.innerHTML = "";
      if (!state.body.length) {
        history.innerHTML = '<div class="empty">Log your weight once a day. The dashboard chart updates automatically.</div>';
        return;
      }

      state.body.slice().reverse().slice(0, 20).forEach((entry) => {
        const row = document.createElement("div");
        row.className = "body-row";
        row.innerHTML = `<div><strong>${entry.weight.toFixed(1)} kg</strong><div class="meta">${fmtDate(entry.date)}${entry.bodyFat ? ` - ${entry.bodyFat}% body fat` : ""}</div></div><span class="badge">${trendLabel(entry)}</span>`;
        history.appendChild(row);
      });
    }

    function trendLabel(entry) {
      const index = state.body.findIndex((item) => item.date === entry.date);
      const previous = state.body[index - 1];
      if (!previous) return "First";
      const delta = entry.weight - previous.weight;
      if (Math.abs(delta) < 0.05) return "Even";
      return `${delta > 0 ? "+" : ""}${delta.toFixed(1)} kg`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function makeId(seed = 0) {
      if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
      return `${Date.now()}-${Math.random().toString(36).slice(2)}-${seed}`;
    }

    function drawWeightChart() {
      const canvas = el("weightChart");
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#141820";
      ctx.fillRect(0, 0, width, height);

      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - chartRange + 1);
      const cutoffKey = dateKey(cutoff);
      const points = state.body.filter((entry) => entry.date >= cutoffKey);

      ctx.fillStyle = "#9aa4b2";
      ctx.font = "24px Inter, sans-serif";
      if (points.length < 2) {
        ctx.fillText("Log at least 2 weigh-ins", 28, 68);
        return;
      }

      const weights = points.map((point) => point.weight);
      const min = Math.min(...weights) - 0.5;
      const max = Math.max(...weights) + 0.5;
      const pad = 36;
      const xFor = (index) => pad + (index / (points.length - 1)) * (width - pad * 2);
      const yFor = (value) => height - pad - ((value - min) / (max - min || 1)) * (height - pad * 2);

      ctx.strokeStyle = "#2a303c";
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const y = pad + (i / 3) * (height - pad * 2);
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(width - pad, y);
        ctx.stroke();
      }

      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();
      points.forEach((point, index) => {
        const x = xFor(index);
        const y = yFor(point.weight);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      points.forEach((point, index) => {
        ctx.fillStyle = "#a7f3d0";
        ctx.beginPath();
        ctx.arc(xFor(index), yFor(point.weight), 6, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = "#cbd3df";
      ctx.font = "22px Inter, sans-serif";
      ctx.fillText(`${max.toFixed(1)} kg`, pad, 28);
      ctx.fillText(`${min.toFixed(1)} kg`, pad, height - 12);
      ctx.fillStyle = "#9aa4b2";
      ctx.font = "20px Inter, sans-serif";
      ctx.fillText(fmtDate(points[0].date), pad, height - 42);
      ctx.fillText(fmtDate(points.at(-1).date), width - pad - 80, height - 42);
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `fitness-everything-${todayKey()}.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function clearData() {
      if (!confirm("Clear all workout and body tracking data?")) return;
      state = { workouts: {}, body: [], prs: [], lastSplit: "Push" };
      selectedSplit = "Push";
      saveState();
      render();
    }

    function render() {
      el("todayLabel").textContent = new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      renderDashboard();
      renderWorkout();
      renderBody();
      drawWeightChart();
    }

    qsa(".tab").forEach((button) => button.addEventListener("click", () => setActiveView(button.dataset.view)));
    qsa("#splitButtons .quick").forEach((button) => button.addEventListener("click", () => setSplit(button.dataset.split)));
    qsa(".range").forEach((button) => button.addEventListener("click", () => {
      chartRange = Number(button.dataset.range);
      qsa(".range").forEach((range) => range.classList.toggle("active", range === button));
      drawWeightChart();
    }));
    el("addExercise").addEventListener("click", addExercise);
    el("saveBody").addEventListener("click", saveBody);
    el("exportData").addEventListener("click", exportData);
    el("clearData").addEventListener("click", clearData);
    ["exerciseName", "sets", "reps", "weight"].forEach((id) => {
      el(id).addEventListener("keydown", (event) => {
        if (event.key === "Enter") addExercise();
      });
    });
    ["bodyWeight", "bodyFat"].forEach((id) => {
      el(id).addEventListener("keydown", (event) => {
        if (event.key === "Enter") saveBody();
      });
    });

    render();
  </script>
</body>
</html>
